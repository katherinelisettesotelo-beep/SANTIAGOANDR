<style id="css">
/* Concepto: la tarjeta del osito es el portal; debajo, secciones suaves en salvia y beige con la lista como protagonista. */
:root{
  --bg:#FBF8F1; --surface:#FFFEFA; --surface2:#F3EBDC; --ink:#5A4F43; --mute:#7A6D60;
  --line:#E4DAC8; --blob1:#DCE9CD; --blob2:#F1E6D2;
  --accent:#587C49; --on-accent:#FFFFFF; --accent-soft:#E1EDD5; --accent-ink:#3D5A32;
  --tan:#B98A5E; --danger:#9A4A3A;
  --bal1:#A9C497; --bal2:#EADDC4; --bal3:#C9A27E;
  --shadow:0 18px 40px -22px rgba(90,79,67,.45);
  --font-display:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --font-body:"Alegreya",Georgia,"Times New Roman",serif;
  --font-ui:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B211C; --surface:#252D26; --surface2:#2D372E; --ink:#EEE7D9; --mute:#B8AF9F;
    --line:#3A463B; --blob1:#2A3A2A; --blob2:#2E2B23;
    --accent:#9CC08B; --on-accent:#15200F; --accent-soft:#33422F; --accent-ink:#CFE6C0;
    --tan:#D3B08C; --danger:#E09A88;
    --bal1:#7F9F6E; --bal2:#CDBF9F; --bal3:#B8916C;
    --shadow:0 18px 40px -22px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B211C; --surface:#252D26; --surface2:#2D372E; --ink:#EEE7D9; --mute:#B8AF9F;
  --line:#3A463B; --blob1:#2A3A2A; --blob2:#2E2B23;
  --accent:#9CC08B; --on-accent:#15200F; --accent-soft:#33422F; --accent-ink:#CFE6C0;
  --tan:#D3B08C; --danger:#E09A88;
  --bal1:#7F9F6E; --bal2:#CDBF9F; --bal3:#B8916C;
  --shadow:0 18px 40px -22px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:1.0625rem; line-height:1.55;
  padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
body.has-hostbar{padding-bottom:110px}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(60vmax 60vmax at 108% -8%,var(--blob1) 0,transparent 62%),
   radial-gradient(44vmax 44vmax at -12% 34%,var(--blob2) 0,transparent 66%),
   radial-gradient(40vmax 40vmax at 100% 78%,var(--blob1) 0,transparent 64%);}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto}
h1,h2,h3,p{margin:0}
h2{font-family:var(--font-body);font-weight:500;font-size:clamp(1.6rem,4.4vw,2.1rem);line-height:1.15;text-wrap:balance}
h3{font-family:var(--font-body);font-weight:700;font-size:1.15rem;line-height:1.25}
.eyebrow{font-family:var(--font-ui);font-size:.82rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:500}
.mute{color:var(--mute)}
label{display:block;font-family:var(--font-ui);font-size:.9rem;font-weight:500;letter-spacing:.04em;color:var(--mute);margin:14px 0 6px}
input,textarea,select{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;min-height:46px}
textarea{resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--tan);outline-offset:2px}
.err{color:var(--danger);font-family:var(--font-ui);font-size:.92rem;margin-top:6px}

/* navegación */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;padding:10px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.brand{font-family:var(--font-display);letter-spacing:.2em;text-transform:uppercase;font-size:.85rem;color:var(--mute);margin-right:auto;white-space:nowrap}
.nav-links{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-left:auto;max-width:100%}
.nav-links::-webkit-scrollbar{display:none}
.chip{font-family:var(--font-ui);font-weight:500;font-size:.95rem;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.chip.host{border-style:dashed}
@media (max-width:560px){.brand{display:none}}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);font-family:var(--font-ui);font-weight:700;font-size:1rem;letter-spacing:.02em;text-decoration:none;cursor:pointer;transition:transform .15s ease,filter .15s ease}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled,.btn[aria-disabled="true"]{background:var(--surface2);color:var(--mute);cursor:not-allowed;transform:none;filter:none}
.btn-ghost{background:transparent;color:var(--accent-ink);border:1.5px solid var(--accent)}
.btn-ghost:hover{background:var(--accent-soft)}
.btn-small{min-height:36px;padding:0 14px;font-size:.9rem}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}

/* portada */
.hero{display:grid;grid-template-columns:1fr;gap:28px;align-items:center;padding:18px 0 44px}
@media (min-width:820px){.hero{grid-template-columns:1.1fr .9fr;gap:56px;padding:34px 0 64px}}
.hero-text{display:flex;flex-direction:column;gap:14px;min-width:0}
h1{font-family:var(--font-display);font-weight:400;text-transform:uppercase;letter-spacing:.16em;font-size:clamp(2.1rem,8vw,3.6rem);line-height:1.08;color:var(--ink);text-wrap:balance}
.quote{font-style:italic;font-size:1.2rem;color:var(--mute);max-width:30ch}
.lead{max-width:44ch}
.count{display:flex;gap:10px;margin-top:6px}
.tile{display:flex;flex-direction:column;align-items:center;min-width:76px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line)}
.tile b{font-family:var(--font-display);font-size:1.9rem;line-height:1;font-weight:500;font-variant-numeric:tabular-nums;color:var(--accent-ink)}
.tile span{font-family:var(--font-ui);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.count-done{font-style:italic;color:var(--mute)}
.card-pic{position:relative;justify-self:center;width:min(100%,400px)}
.card-pic img{display:block;width:100%;height:auto;border-radius:6px;box-shadow:var(--shadow);transform:rotate(-1.4deg);transition:transform .4s ease;border:8px solid #fff}
.card-pic:hover img{transform:rotate(0)}
.float{position:absolute;pointer-events:none;width:44px;animation:drift 6s ease-in-out infinite}
.float svg{display:block;width:100%;height:auto;overflow:visible}
.float.a{left:-18px;top:6%;animation-delay:-1s}
.float.b{right:-14px;top:30%;width:34px;animation-delay:-3s}
.float.c{left:-10px;bottom:10%;width:30px;animation-delay:-4.5s}
@media (max-width:560px){.float.a{left:-2px}.float.b{right:-2px}.float.c{left:-2px}.float.d{right:-2px}}
@keyframes drift{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}

/* ecografía */
.eco{display:grid;grid-template-columns:1fr;gap:26px;align-items:center;justify-items:center;text-align:center;padding:6px 0 44px}
.eco-text{display:flex;flex-direction:column;gap:8px;max-width:36ch;min-width:0}
.eco-fig{position:relative;margin:0}
.eco-ring{width:min(76vw,300px);aspect-ratio:1;max-width:100%;border-radius:50%;padding:10px;background:linear-gradient(145deg,var(--blob1),var(--bal2));box-shadow:var(--shadow)}
.eco-ring img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;background:#000}
.float.d{right:-14px;top:-6px;width:36px;animation-delay:-2s}
@media (min-width:820px){.eco{grid-template-columns:auto 1fr;justify-items:start;text-align:left;gap:56px}}

/* secciones */
section{padding:34px 0;scroll-margin-top:72px}
.sec-head{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;max-width:60ch}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px 28px;margin:6px 0 0;padding:0}
.fact{display:flex;flex-direction:column;gap:2px;min-width:0}
.fact dt{font-family:var(--font-ui);font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.fact dd{margin:0;font-size:1.3rem;line-height:1.25}
.note{display:inline-block;margin-top:18px;padding:8px 14px;border-radius:999px;background:var(--surface2);font-family:var(--font-ui);font-size:.95rem}

/* progreso */
.progress{margin:0 0 20px;max-width:520px}
.bar{height:14px;border-radius:999px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--bal1),var(--accent));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.progress p{font-family:var(--font-ui);margin-top:8px;font-size:.98rem}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}

/* regalos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.gift{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line);min-width:0;transition:transform .2s ease,box-shadow .2s ease}
.gift:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.gift.done{background:var(--surface2)}
.gift.done h3{text-decoration:line-through;text-decoration-color:var(--tan);text-decoration-thickness:1.5px}
.gift-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);flex:none}
.ico svg{width:26px;height:26px}
.pill{font-family:var(--font-ui);font-size:.82rem;font-weight:500;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--mute);white-space:nowrap}
.pill-part{border-color:var(--tan);color:var(--tan)}
.pill-done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.gift p.sub{color:var(--mute);font-size:.98rem}
.by{font-family:var(--font-ui);font-size:.92rem;color:var(--accent-ink)}
.gift .btn{margin-top:auto;width:100%}
.free{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:20px;border:1.5px dashed var(--tan);min-width:0}
.empty{padding:24px;border-radius:16px;background:var(--surface2);color:var(--mute)}

/* anfitriona */
.hostctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:10px;border-top:1px dashed var(--line)}
.hostctl form{display:flex;gap:6px;width:100%}
.hostctl input{min-height:38px;padding:6px 10px}
.name-chip{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 10px;border-radius:999px;background:var(--accent-soft);font-family:var(--font-ui);font-size:.9rem}
.x{border:0;background:transparent;color:var(--danger);cursor:pointer;font-size:1.1rem;line-height:1;padding:6px 8px;min-height:32px}
.host-panel{margin:6px 0 10px;padding:18px;border-radius:20px;border:1.5px dashed var(--tan);background:var(--surface)}
.host-panel p{color:var(--mute);margin-top:6px}
.add-gift{margin-top:22px;padding:18px;border-radius:20px;border:1.5px dashed var(--tan);display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.add-gift h3,.add-gift .full{grid-column:1/-1}
.hostbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1.5px solid var(--line);font-family:var(--font-ui)}

/* confirmar */
.rsvp-grid{display:grid;grid-template-columns:1fr;gap:30px}
@media (min-width:820px){.rsvp-grid{grid-template-columns:1fr 1fr;gap:56px}}
.form{max-width:480px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--accent-ink);font-size:1.4rem;cursor:pointer;font-family:var(--font-ui)}
.stepper button:hover{background:var(--accent-soft)}
.stepper output{min-width:2ch;text-align:center;font-family:var(--font-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.result{margin-top:20px;padding:20px;border-radius:20px;background:var(--accent-soft);border:1.5px solid var(--accent)}
.result p{margin-bottom:10px}
.going{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.going .name-chip{background:var(--surface);border:1.5px solid var(--line);padding:6px 12px;font-size:.95rem}
.people{font-family:var(--font-display);font-size:2.4rem;line-height:1;color:var(--accent-ink);font-variant-numeric:tabular-nums}
footer{padding:30px 0 10px;text-align:center;color:var(--mute);font-style:italic}

/* hoja de diálogo */
.sheet{position:fixed;inset:0;z-index:40;display:grid;align-items:end;justify-items:center;background:rgba(30,26,20,.5)}
.panel{width:min(100%,500px);max-height:92%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:22px 20px max(22px,env(safe-area-inset-bottom,0px));animation:up .25s ease}
@media (min-width:600px){.sheet{align-items:center}.panel{border-radius:24px}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.close{float:right;border:0;background:var(--surface2);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:1.3rem;cursor:pointer}

/* globos al confirmar */
.rise{position:fixed;bottom:-90px;width:40px;z-index:50;pointer-events:none;animation:rise 3.4s ease-in forwards}
.rise svg{width:100%;height:auto;display:block}
@keyframes rise{to{transform:translateY(-120vh) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .float,.rise,.panel{animation:none}
  .bar i,.btn,.gift,.card-pic img{transition:none}
}
</style>

/* ---------- cuenta regresiva ---------- */
function tick(){
 const el=$('#count'); if(!el)return;
 const ms=EVENT-Date.now();
 if(ms<=0){el.innerHTML='<p class="count-done">La celebración ya comenzó. Gracias por acompañarnos.</p>';return}
 const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);
 el.innerHTML=[[d,plural(d,'día','días')],[h,plural(h,'hora','horas')],[m,'min']].map(a=>'<div class="tile"><b>'+a[0]+'</b><span>'+a[1]+'</span></div>').join('');
}

 const named=g.by.filter(n=>n!=='Reservado');
 const names=hostMode?'':(named.length?'<p class="by">Lo regalan: '+named.map(esc).join(', ')+'</p>':(full?'<p class="by">Ya lo tenemos. ¡Gracias!</p>':''));
 const act=full?'<button class="btn" disabled type="button">Ya está elegido</button>':'<button class="btn" data-pick="'+g.id+'" type="button">Quiero regalarlo</button>';
 let host='';
 if(hostMode){
  host='<div class="hostctl">'+g.by.map((n,i)=>'<span class="name-chip">'+esc(n)+'<button class="x" data-unby="'+g.id+'|'+i+'" type="button" aria-label="Quitar a '+esc(n)+'">×</button></span>').join('')
   +(full?'':'<form class="addby" data-gid="'+g.id+'"><input aria-label="Quién lo regala" placeholder="Quién lo regala" required><button class="btn btn-small" type="submit">Marcar</button></form>')
   +'<button class="chip" data-q="'+g.id+'|-1" type="button" aria-label="Menos unidades">−</button><span class="by">'+g.q+' '+plural(g.q,'unidad','unidades')+'</span><button class="chip" data-q="'+g.id+'|1" type="button" aria-label="Más unidades">+</button>'
   +'<button class="chip" data-del="'+g.id+'" type="button">Quitar regalo</button></div>';
 }
 return '<article class="gift'+(full?' done':'')+'"><div class="gift-top"><span class="ico">'+ico(g.ic)+'</span>'+pill+'</div><h3>'+esc(g.n)+'</h3>'+(g.note?'<p class="sub">'+esc(g.note)+'</p>':'')+names+act+host+'</article>';
}
function renderGifts(){
 const t=totals(), pct=t.total?Math.round(t.taken/t.total*100):0;
 $('#progress').innerHTML='<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+t.total+'" aria-valuenow="'+t.taken+'"><i style="width:'+pct+'%"></i></div><p>'+t.taken+' de '+t.total+' regalos ya elegidos</p>';
 const open=draft.gifts.filter(g=>g.by.length<g.q).length, chosen=draft.gifts.filter(g=>g.by.length>0).length;
 $('#filters').innerHTML=[['all','Todos',draft.gifts.length],['open','Disponibles',open],['done','Ya elegidos',chosen]].map(f=>'<button class="chip" data-filter="'+f[0]+'" aria-pressed="'+(filter===f[0])+'" type="button">'+f[1]+' · '+f[2]+'</button>').join('');
 let list=draft.gifts.filter(g=>filter==='all'||(filter==='open'?g.by.length<g.q:g.by.length>0));
 let html=list.map(giftCard).join('');
 if(!list.length)html='<div class="empty">'+(filter==='done'?'Todavía nadie eligió un regalo. Puedes ser la primera persona.':'Todos los regalos ya fueron elegidos. Gracias a todos.')+'</div>';
 if(filter==='all')html+='<div class="free"><span class="ico">'+ico('gift')+'</span><h3>¿Prefieres sorprendernos?</h3><p class="sub">Cualquier detalle hecho con cariño es bienvenido. No hace falta avisar.</p></div>';
 $('#grid').innerHTML=html;
 $('#gift-host').innerHTML=hostMode?'<form class="add-gift" id="add-gift"><h3>Agregar un regalo a la lista</h3><div><label for="ag-n">Nombre</label><input id="ag-n" required></div><div><label for="ag-note">Detalle</label><input id="ag-note"></div><div><label for="ag-q">Unidades</label><input id="ag-q" type="number" min="1" max="20" value="1"></div><div><label for="ag-ic">Ícono</label><select id="ag-ic">'+Object.keys(ICON_NAMES).map(k=>'<option value="'+k+'">'+ICON_NAMES[k]+'</option>').join('')+'</select></div><div class="full"><button class="btn" type="submit">Agregar a la lista</button></div></form>':'';
}

/* ---------- asistencia ---------- */
function renderRsvp(){
 const n=people();
 let h='<p class="eyebrow">Ya confirmaron</p><p class="people">'+n+'</p><p class="mute">'+plural(n,'persona nos acompaña','personas nos acompañan')+'</p>';
 if(draft.rsvp.length){
  h+='<div class="going">'+draft.rsvp.map((r,i)=>'<span class="name-chip">'+esc(r.n)+(r.k>1?' +'+(r.k-1):'')+(hostMode?'<button class="x" data-rmr="'+i+'" type="button" aria-label="Quitar a '+esc(r.n)+'">×</button>':'')+'</span>').join('')+'</div>';
 }else h+='<div class="empty" style="margin-top:14px">Aún no hay confirmaciones. Puedes ser la primera persona.</div>';
 if(hostMode)h+='<form class="hostctl" id="add-rsvp" style="margin-top:18px"><input id="ar-n" aria-label="Nombre" placeholder="Nombre de quien confirmó" required><input id="ar-k" aria-label="Personas" type="number" min="1" max="12" value="1" style="max-width:90px"><button class="btn btn-small" type="submit">Registrar</button></form>';
 $('#rsvp-list').innerHTML=h;
}

/* ---------- anfitriona ---------- */
function renderHost(){
 const hb=$('#hostbar'), tg=$('#host-toggle');
 tg.hidden=!isHost; tg.setAttribute('aria-pressed',hostMode);
 $('#host-panel').innerHTML=hostMode?'<div class="host-panel"><h3>Modo anfitriona</h3><p>Cuando alguien te avise por WhatsApp, marca su regalo o su asistencia aquí. Los invitados ven los cambios cuando publiques.</p><label for="wa">Tu número de WhatsApp con código de país</label><input id="wa" inputmode="tel" placeholder="51 999 999 999" value="'+esc(draft.wa||'')+'"></div>':'';
 hb.hidden=!(hostMode);
 document.body.classList.toggle('has-hostbar',hostMode);
 if(hostMode)updateBar();
}
function updateBar(){
 $('#hostbar').innerHTML='<span>'+(dirty?'Tienes cambios sin publicar.':'Sin cambios pendientes.')+'</span><button class="btn btn-small" data-publish type="button"'+(dirty&&api?'':' disabled')+'>Publicar cambios</button>';
}
function mark(){dirty++;renderGifts();renderRsvp();updateBar()}
function buildDoc(){
 const css=$('#css').textContent, app=$('#app').textContent;
 const st=JSON.stringify(draft).replace(/</g,'\\u003c');
 return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'
  +'<title>'+TITLE+'</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="'+FONTS+'">\n<style id="css">'+css+'</style>\n<div id="root"></div>\n'
  +'<script type="application/json" id="state">'+st+'<\/script>\n<script type="text/plain" id="hero-data">'+HERO+'<\/script>\n<script type="text/plain" id="eco-data">'+ECO+'<\/script>\n<script id="app">'+app+'<\/script>\n</body></html>';
}
async function publish(btn){
 if(!api)return; btn.disabled=true; btn.textContent='Publicando…';
 try{await api.publish(buildDoc())}
 catch(e){
  btn.disabled=false; btn.textContent='Publicar cambios';
  const code=e&&e.code;
  alert2(code==='conflict'?'Otra versión se publicó antes. La página se recargará con ella.':'No se pudo publicar. Inténtalo de nuevo.');
 }
}
function alert2(t){const s=$('#hostbar');const m=document.createElement('span');m.textContent=t;m.className='err';s.prepend(m);setTimeout(()=>m.remove(),5000)}

/* ---------- hoja de regalo ---------- */
function openSheet(html){
 lastFocus=document.activeElement;
 $('#sheet-body').innerHTML=html; $('#sheet').hidden=false;
 const f=$('#sheet input'); if(f)f.focus();
}
function closeSheet(){$('#sheet').hidden=true;current=null;if(lastFocus&&lastFocus.focus)lastFocus.focus()}
function openGift(id){
 const g=draft.gifts.find(x=>x.id===id); if(!g)return;
 current={g};
 openSheet('<h3 id="sheet-t">Regalar: '+esc(g.n)+'</h3><p class="mute">Escribe tu nombre y avisa por WhatsApp. Así lo marcamos como elegido y nadie más lo repite.</p><label for="sheet-name">Tu nombre</label><input id="sheet-name" autocomplete="name" value="'+esc(lsGet('bs-name')||'')+'"><label for="sheet-msg">Mensaje</label><textarea id="sheet-msg" rows="4" readonly></textarea><div class="row"><a class="btn" id="sheet-wa" target="_blank" rel="noopener" aria-disabled="true">Avisar por WhatsApp</a><button class="btn btn-ghost" data-copy="#sheet-msg" type="button">Copiar mensaje</button></div><p class="mute" id="sheet-hint" style="margin-top:12px"></p>');
 updateSheet();
}
function updateSheet(){
 if(!current)return;
 const name=$('#sheet-name').value.trim();
 const msg='Hola, soy '+(name||'[tu nombre]')+'. Quiero regalar “'+current.g.n+'” para Santiago André. ¿Me lo reservas? Gracias.';
 $('#sheet-msg').value=msg;
 const wa=$('#sheet-wa'), link=name?waLink(msg):'';
 if(link){wa.href=link;wa.setAttribute('aria-disabled','false')}else{wa.removeAttribute('href');wa.setAttribute('aria-disabled','true')}
 $('#sheet-hint').textContent=!name?'Escribe tu nombre para continuar.':(link?'':'Copia el mensaje y envíalo por WhatsApp a los papás de Santiago.');
 if(name)lsSet('bs-name',name);
}

/* ---------- utilidades ---------- */
function flash(btn,t){const o=btn.textContent;btn.textContent=t;setTimeout(()=>{btn.textContent=o},1800)}
function copyFrom(text,btn,ta){
 const fb=()=>{if(ta){ta.focus();ta.select();try{document.execCommand('copy')}catch(e){}flash(btn,'Seleccionado, copia')}else flash(btn,'No se pudo copiar')};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>flash(btn,'Copiado'),fb)}else fb();
}
function burst(){
 if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 for(let i=0;i<9;i++){
  const d=document.createElement('div'); d.className='rise';
  d.style.left=(5+Math.random()*88)+'%'; d.style.animationDelay=(Math.random()*0.8)+'s'; d.style.width=(30+Math.random()*24)+'px';
  d.innerHTML=balloon(1+i%3); document.body.appendChild(d); setTimeout(()=>d.remove(),4600);
 }
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('button,a'); if(!t)return;
 if(t.dataset.go){const el=document.getElementById(t.dataset.go);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
 else if(t.dataset.filter){filter=t.dataset.filter;renderGifts()}
 else if(t.dataset.pick)openGift(t.dataset.pick);
 else if('close' in t.dataset)closeSheet();
 else if(t.dataset.copy){const ta=$(t.dataset.copy);copyFrom(ta.value,t,ta)}
 else if(t.dataset.copytext)copyFrom(t.dataset.copytext,t,null);
 else if(t.dataset.step){rsvpK=Math.min(12,Math.max(1,rsvpK+Number(t.dataset.step)));$('#rsvp-k').textContent=rsvpK}
 else if('hosttoggle' in t.dataset){hostMode=!hostMode;renderHost();renderGifts();renderRsvp()}
 else if('publish' in t.dataset)publish(t);
 else if(t.dataset.unby){const p=t.dataset.unby.split('|'),g=draft.gifts.find(x=>x.id===p[0]);if(g){g.by.splice(Number(p[1]),1);mark()}}
 else if(t.dataset.del){draft.gifts=draft.gifts.filter(x=>x.id!==t.dataset.del);mark()}
 else if(t.dataset.q){const p=t.dataset.q.split('|'),g=draft.gifts.find(x=>x.id===p[0]);if(g){g.q=Math.min(20,Math.max(Math.max(1,g.by.length),g.q+Number(p[1])));mark()}}
 else if(t.dataset.rmr){draft.rsvp.splice(Number(t.dataset.rmr),1);mark()}
});
$('#root').addEventListener('input',e=>{
 if(e.target.id==='wa'){draft.wa=e.target.value.trim();dirty++;updateBar()}
});
document.addEventListener('input',e=>{if(e.target.id==='sheet-name')updateSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('submit',e=>{
 const f=e.target; e.preventDefault();
 if(f.id==='rsvp-form'){
  const name=$('#rsvp-name').value.trim();
  $('#rsvp-err').hidden=!!name; if(!name){$('#rsvp-name').focus();return}
  lsSet('bs-name',name);
  const note=$('#rsvp-note').value.trim();
  const msg='Hola, soy '+name+'. Confirmo mi asistencia al baby shower de Santiago André, sábado 14 de noviembre, 20:00 hrs. Iremos '+rsvpK+' '+plural(rsvpK,'persona','personas')+'.'+(note?' '+note:'');
  const link=waLink(msg);
  $('#rsvp-result').innerHTML='<div class="result"><h3>Gracias, '+esc(name)+'</h3><p>Falta un último paso: envía este mensaje para que tu confirmación quede registrada.</p><textarea id="rsvp-msg" rows="4" readonly>'+esc(msg)+'</textarea><div class="row">'+(link?'<a class="btn" href="'+link+'" target="_blank" rel="noopener">Enviar por WhatsApp</a>':'')+'<button class="btn btn-ghost" data-copy="#rsvp-msg" type="button">Copiar mensaje</button></div>'+(link?'':'<p class="mute" style="margin-top:12px">Envía el mensaje por WhatsApp a los papás de Santiago.</p>')+'</div>';
  burst(); $('#rsvp-result').scrollIntoView({behavior:'smooth',block:'center'});
 }else if(f.classList.contains('addby')){
  const g=draft.gifts.find(x=>x.id===f.dataset.gid),v=$('input',f).value.trim();
  if(g&&v&&g.by.length<g.q){g.by.push(v);mark()}
 }else if(f.id==='add-gift'){
  const n=$('#ag-n').value.trim(); if(!n)return;
  draft.gifts.push({id:'g'+Date.now().toString(36),n:n,note:$('#ag-note').value.trim(),ic:$('#ag-ic').value,q:Math.min(20,Math.max(1,Number($('#ag-q').value)||1)),by:[]});
  mark();
 }else if(f.id==='add-rsvp'){
  const n=$('#ar-n').value.trim(); if(!n)return;
  draft.rsvp.push({n:n,k:Math.min(12,Math.max(1,Number($('#ar-k').value)||1))}); mark();
 }
});

/* ---------- arranque ---------- */
shell(); tick(); setInterval(tick,30000); renderGifts(); renderRsvp(); renderHost();
(async()=>{
 try{
  if(!(window.claude&&claude.use))return;
  const u=await claude.use('user'), a=await claude.use('artifact');
  if(u&&a&&(u.isOwner()||u.canEdit())){api=a;isHost=true;renderHost()}
 }catch(e){}
})();
})();
</script>
</body></html>
